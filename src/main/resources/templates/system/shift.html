        function saveShift() {
            let url = '/api/system/shift';

            let data = FormUtil.extractForm($('#shiftForm'));

            const project_name = data.ProjectName;
            const jumun_num = data.jumun_num;
            const work_order = data.work_order;
            const workJson = data.work_type_json;
            const saveFlag = EditFlag;

            if(!jumun_num || !work_order){
                Alert.alert('', '작업지시를 선택해주세요.')
                return;
            }

            if(!project_name){
                Alert.alert('', '프로젝트명을 입력해주세요.')
                $('#ProjectName').focus();
                return;
            }
            if (!workJson || workJson === "[]" || JSON.parse(workJson).length === 0) {
                Alert.alert('', '근무구분을 한 개 이상 입력해주세요.');
                return;
            }
            if (!data.StartTime) {
                Alert.alert('', '시작시간을 입력해주세요')
                $('#shiftForm #StartTime').focus();
                return false;
            }
            if (!data.EndTime) {
                Alert.alert('', '종료시간을 입력해주세요')
                $('#shiftForm #EndTime').focus();
                return false;
            }
            data.spjangcd= spjangcd;
            data.save_flag = saveFlag;

            let fnSuccess = function (result) {
                if (result.success) {
                    Alert.alert('', '저장되었습니다');
                    searchMainData(); // 저장 후 데이터 갱신
                } else {
                    Alert.alert('저장 실패', result.message);
                    console.error('저장 실패:', result.message);
                }
            }
            AjaxUtil.postAsyncData(url + '/save', data, fnSuccess);
        }


        function deleteShift() {
            let url = '/api/system/shift';
            let job_res_id = $('#shiftForm').find('#job_res_id').val();
            let data = {'job_res_id': job_res_id};
            let fnSuccess = function (res) {
                if (res.success) {
                    Alert.alert('', '삭제되었습니다');
                    $('#btnNew').click();
                    searchMainData();

                } else {
                    Alert.alert('삭제 실패', res.message);
                    console.error('삭제 실패:', res.message);
                }
            }

            AjaxUtil.postAsyncData(url + "/delete", data, fnSuccess);
        }

            document.getElementById("modal_code").value = "";
            document.getElementById("modal_name").value = "";

            document.getElementById("workTypeModal").style.display = "flex";
        }

        // 태그 클릭 -> 수정
        function openEditWorkTypeModal(tag) {
            isEditMode = true;  // 수정 모드 활성화
            editTargetTag = tag;

            document.getElementById("modal_code").value = tag.dataset.code;
            document.getElementById("modal_name").value = tag.dataset.name;

            document.getElementById("workTypeModal").style.display = "flex";
        }

        // 모달 닫기
        function closeWorkTypeModal() {
            document.getElementById("workTypeModal").style.display = "none";

            // 모달 닫을 때 모드 초기화
            isEditMode = false;
            editTargetTag = null;
        }

        // 태그 추가
        function addWorkType() {

            const code = document.getElementById("modal_code").value.trim();
            const name = document.getElementById("modal_name").value.trim();

            if (!code || !name) {
                Alert.alert('', "코드와 코드명을 입력하세요.");
                return;
            }

            const tags = document.querySelectorAll(".work-tag");

            // === ✔ 중복 체크 (본인 제외) ===
            for (let tag of tags) {
                if (tag !== editTargetTag && tag.dataset.code === code) {
                    Alert.alert('', "이미 존재하는 코드입니다.");
                    return;
                }
                if (tag !== editTargetTag && tag.dataset.name === name) {
                    alert("이미 존재하는 코드명입니다.");
                    return;
                }
            }

            if (!isEditMode) {
                // 추가 모드
                const newTag = createTagElement(code, name);
                document.getElementById("work_type_tags").appendChild(newTag);
            }
            else {
                // 수정 모드
                const updatedTag = createTagElement(code, name);

                // 기존 태그를 이걸로 교체
                editTargetTag.replaceWith(updatedTag);
                editTargetTag = null;
            }

            updateWorkTypeValue();
            closeWorkTypeModal();
        }

        function removeTag(el) {
            el.parentElement.remove();
            updateWorkTypeValue();
        }

        function createTagElement(code, name) {
            const tag = document.createElement("span");
            tag.classList.add("work-tag");
            tag.dataset.code = code;
            tag.dataset.name = name;

            tag.style.cssText = `
        background:#d9edf7;
        border:1px solid #bcdff1;
        padding:3px 6px;
        border-radius:4px;
        margin-right:4px;
        cursor:pointer;
        display:inline-flex;
        align-items:center;
        gap:4px;
    `;

            // 텍스트 노드
            const text = document.createTextNode(`#${name}`);
            tag.appendChild(text);

            // 삭제 버튼
            const removeBtn = document.createElement("span");
            removeBtn.textContent = "x";
            removeBtn.style.cssText = "color:red; cursor:pointer; font-weight:bold;";
            removeBtn.classList.add("tag-remove");

            removeBtn.onclick = function(e) {
                e.stopPropagation(); // 삭제 클릭 시 수정모달 열리는 것 방지
                tag.remove();
                updateWorkTypeValue();
            };

            tag.appendChild(removeBtn);

            // 태그 클릭 시 수정 활성화
            tag.onclick = function() {
                openEditWorkTypeModal(tag);
            };

            return tag;
        }

        function updateWorkTypeValue() {
            const tags = document.querySelectorAll(".work-tag");

            const list = [];

            tags.forEach(tag => {
                list.push({
                    code: tag.dataset.code,
                    name: tag.dataset.name
                });
            });

            document.getElementById("work_type_json").value = JSON.stringify(list);
        }

        function renderWorkTypeTags(workList) {
            const tagContainer = document.getElementById("work_type_tags");
            tagContainer.innerHTML = ""; // 초기화

            workList.forEach(item => {
                const tag = createTagElement(item.code, item.name);
                tagContainer.appendChild(tag);
            });

            updateWorkTypeValue(); // JSON 값 반영
        }
