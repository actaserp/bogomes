<html layout:decorate="~{layout_page}" xmlns:layout="http://www.w3.org/1999/xhtml">
<head>
  <style>
      .wj-header {
          text-align: center !important;
      }

      .input-with-button {
          display: flex;
          gap: 4px; /* 버튼과 input 사이 여백 */
          align-items: center;
      }

      .input-with-button input {
          flex: 1; /* 나머지 영역 차지 */
          min-width: 0;
          padding: 4px;
      }

      .input-with-button .btn.in_btn {
          flex-shrink: 0;
          width: 40px;
      }

      .input-with-button button img, .btn img {
          margin-right: 1px;
      }

      .write-table input, select {
          width: auto;
      }

      /* 1366px 이하: 오른쪽 폼 감추고, 섹션을 세로 스택 + 상단 저장/삭제/AS버튼 숨김 */
      @media (max-width: 1366px) {
          .layout-contents > div[style*="display: flex"] > section:last-of-type {
              display: none !important;
          }

          .layout-contents > div[style*="display: flex"] {
              flex-direction: column !important;
          }

          .layout-contents > div[style*="display: flex"] > section {
              width: 100% !important;
          }

          /* 기본 폼은 감춤 (모달로만 사용) */
          .table-wrap {
              display: none !important;
          }

          /* 작은 화면에선 상단 버튼은 모달 전용 버튼으로 대체 */
          #btnSave, #btnDel, #btnASList {
              display: none !important;
          }

          /*.ax5modal[data-modal-els="root"] {
              height: 70dvh !important; !* 동적 뷰포트 *!
              height: 70svh !important; !* iOS safe *!
              height: 70vh !important; !* fallback *!
              top: 5dvh !important; !* 살짝 아래 띄우기(원하면 0) *!
              display: flex;
              flex-direction: column;
          }

          !* 라이브러리가 주입한 body의 inline height 무력화: Flex로 채우기 *!
          .ax5modal[data-modal-els="root"] .ax-modal-body {
              display: flex;
              flex-direction: column;
              height: calc(100vh - 40px) !important;
              overflow: hidden; !* 밖으로 튀는 것 차단 *!
          }
*/
          /* 모달 내부 래퍼: 세로 플렉스 */
          .ax5modal .modal-form-wrap {
              display: flex;
              flex-direction: column;
              flex: 1 1 auto;
              min-height: 0; /* 내부 스크롤 허용 */
          }

          /* 폼만 스크롤 */
          .ax5modal .modal-form-wrap > #basicForm_modal {
              flex: 1 1 auto;
              min-height: 0;
              overflow: auto;      /* 스크롤은 여기서만 */
              padding: 8px;        /* 인라인 대신 CSS */
              box-sizing: border-box;
          }

          /* 하단 버튼 고정 영역 (sticky) */
          .ax5modal .modal-form-wrap .modal-actions {
              position: sticky;
              bottom: 0;
              left: 0;
              right: 0;
              width: 100%;
              z-index: 1;
              background: #fff;            /* 스크롤 시 내용과 분리 */
              border-top: 1px solid #e5e7eb;
              padding: 8px;
              display: flex;               /* 버튼 정렬 */
              justify-content: center;
              gap: 8px;
              flex-wrap: wrap;             /* 버튼 많으면 줄바꿈 */
              text-align: center;          /* 혹시 텍스트가 있으면 정렬 */
          }

          .modal-form-wrap {
              --fs-base: 13.5px;
              --fs-label: 13px;
              --cell-pad-y: 6px;
              --cell-pad-x: 8px;
              --input-h: 34px;
          }
          .btn-aslist {
              color: #fff !important;
              background-color: #337ab7 !important;
              border-color: #337ab7 !important;
              font-size: revert;
          }

      }

      /* 공통(모달 내부 기본값) */
      .modal-form-wrap {
          --fs-base: 14px; /* 기본 본문 폰트 */
          --fs-label: 13px; /* 라벨/테이블 헤더 */
          --cell-pad-y: 8px; /* 셀 상하 패딩 */
          --cell-pad-x: 10px; /* 셀 좌우 패딩 */
          --input-h: 36px; /* 인풋/셀렉트 높이 */

          font-size: var(--fs-base);
      }

      .modal-form-wrap .write-table th,
      .modal-form-wrap .write-table td {
          padding: var(--cell-pad-y) var(--cell-pad-x);
      }

      .modal-form-wrap input[type="text"],
      .modal-form-wrap input[type="date"],
      .modal-form-wrap select {
          height: var(--input-h);
      }

      @media (max-width: 768px) {
          #basicForm_modal .write-table {
              font-size: 0.92rem;
          }

          #basicForm_modal input[type="text"],
          #basicForm_modal input[type="date"],
          #basicForm_modal select {
              height: 32px;
          }

          #basicForm_modal textarea {
              min-height: 96px; /* 너무 작아지지 않게 */
          }
      }

      /* 태블릿/모바일(≤1024px) : 한 단계 더 타이트 */
      @media (max-width: 1024px) {
          .modal-form-wrap {
              --fs-base: 13px;
              --fs-label: 12.5px;
              --cell-pad-y: 5px;
              --cell-pad-x: 8px;
              --input-h: 32px;
          }
      }

      /* iPad Pro landscape 같은 1366×1024 케이스에 보수적으로 */
      @media (max-width: 1366px) and (max-height: 1024px) {
          .modal-form-wrap {
              --fs-base: 13px;
              --cell-pad-y: 5px;
              --input-h: 32px;
          }
      }

      /* ultra-small(≤768px) : 모바일에 맞춰 더 타이트 */
      @media (max-width: 768px) {
          .modal-form-wrap {
              --fs-base: 12.5px;
              --fs-label: 12px;
              --cell-pad-y: 4px;
              --cell-pad-x: 6px;
              --input-h: 30px;
          }
      }

      /* 라벨만 미세 조정 */
      .modal-form-wrap .write-table th label {
          font-size: var(--fs-label);
      }

      /* 필요 시 긴 텍스트 입력을 위한 textarea 기본 높이 */
      @media (max-width: 1024px) {
          .modal-form-wrap textarea#fixText {
              min-height: 96px;
          }
      }
      .item-table {
          width: 100%;
          border-collapse: collapse;
          table-layout: fixed;
          margin-top: 10px;
      }

      /* 헤더 셀 스타일 */
      .item-table th {
          background-color: #EDEFF5;
          text-align: center;
          font-weight: bold;
          padding: 8px;
          border: 1px solid #ccc;
      }

      /* 바디 셀 스타일 */
      .item-table td {
          padding: 6px;
          text-align: center;
          border: 1px solid #ccc;
      }

      /* 입력 필드 기본 스타일 */
      .item-table input {
          width: 100%;
          box-sizing: border-box;
          padding: 4px;
      }

      /* 품목 & 비고 왼쪽 정렬 */
      .item-table td:first-child,
      .item-table td:nth-child(6) {
          text-align: left;
      }

      /* 공통 버튼 스타일 */
      .item-table .btn.in_btn {
          display: inline-flex;
          justify-content: center;
          align-items: center;
          width: 30px;
          height: 30px;
          border-radius: 4px;
          padding: 0;
          border: 1px solid #B3B3B3;
          background-color: #fff;
          cursor: pointer;
          transition: background-color 0.2s;
          line-height: 0;
      }

      /* + 버튼 전용 스타일 */
      .item-table .btn.in_btn.plus img {
          width: 10px;
          height: 10px;
          display: block;
      }

      /* 공통 아이콘 버튼 이미지 (삭제, 검색 포함) */
      .item-table .btn.in_btn img {
          width: 12px;
          height: 12px;
          display: block;
          margin-right:2px;
      }
  </style>
</head>

<th:block layout:fragment="scripts">
  <th:block th:replace="/as/popup_as_list :: popup_ASList"></th:block>
  <th:block th:replace="/as/tab_popup_material :: multiform_tab_material"></th:block>
  <script type="text/javascript">
    class ASManagementPage {
      constructor() {
        this.grid = null;
        this.viewData = new wijmo.collections.CollectionView();
        this.url = '/api/definition/ASManagement';
        this._onOpenByClick    = (e) => this._openFromHitTest(e);
        this._onOpenByDblClick = (e) => this._openFromHitTest(e);
        this.init();
      }

      init() {
        let _this = this;
        this.grid = new wijmo.grid.FlexGrid('#theGrid', {
          selectionMode: wijmo.grid.SelectionMode.Row,
          headersVisibility: wijmo.grid.HeadersVisibility.Column,
          autoGenerateColumns: false,
          showMarquee: true,
          isReadOnly: true,
          formatItem: (sender, e) => {
            if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
              e.cell.style.textAlign = 'center';
            }
          },
          columns: [
            {binding: 'id', header: 'id', visible: false},
            {binding: 'asid', header: 'id', visible: false},
            {binding: 'regdate', header: '등록일자', width: 120, align: 'center'},
            {binding: 'vechregno', header: '등록번호', width: 110, align: 'center'},
            {binding: 'itemcode', header: '차량명칭', width: 180, align: 'left'},
            {binding: 'fixdate', header: '점검일자', width: 120, align: 'center'},
            {binding: 'pernm', header: '정비기사', width: 100, align: 'center'},
            {binding: 'partamt', header: '부품합계', width: 100, align: 'right'},
            {binding: 'workamt', header: '공임합계', width: 100, align: 'right'},
            {binding: 'amount', header: '공급가액', width: 100, align: 'right'},
            {binding: 'vamt', header: '부과세', width: 100, align: 'right'},
            {binding: 'totamt', header: '합계', width: 100, align: 'right'},
          ],
          itemsSource: this.viewData, // 데이터를 설정할 배열
        });

        new FlexGridContextMenu(this.grid);
        this.grid.downloadFileName = 'AS차량점검관리';

        this.bindGridOpenHandler();

        //미디어쿼리/리사이즈 시 핸들러 재바인딩
        const mq = window.matchMedia('(max-width: 1366px)');
        const rebind = () => this.bindGridOpenHandler();
        if (mq.addEventListener) mq.addEventListener('change', rebind);
        else mq.addListener(rebind); // 구형 브라우저 대응
        window.addEventListener('resize', rebind);

        $('#txtRegno').on('keypress', function (e) {
          if (e.keyCode === 13) {
            _this.searchMainData();
          }
        });

        $('#btnASList').click(function () {
          let poppage = new PopASListComponent();
          let $poppage = $(poppage);
          let searchcallback = function (items) {
            console.log('items : ', items);
            document.getElementById('as_id').value = items.asid;
            document.getElementById('itemcode').value = items.itemcode;
            document.getElementById('regno').value = items.regno;
            document.getElementById('vechidno').value = items.vechidno;
          };

          poppage.show(searchcallback);
        });

        // ✅ 폼 단위로 위임 바인딩 (동적 행에도 동작)
        $('#basicForm').on('click', 'a[title="부품 검색"]', function () {
          const $row = $(this).closest('tr');

          // 인덱스 유/무 모두 커버
          const $name   = $row.find('input[name^="txtProductName_"]');
          const $partId = $row.find('input[name^="part_id_"]');

          const pop = new PopTabMatComponent();
          pop.material_type = 'somo,other, jajae';

          pop.show(function (item) {
            if (!item) return;
            // 항목 채우기
            $name.val(item.Name || item.name || '');
            $partId.val(item.id || '');

          });
        });

      }

      _openFromHitTest(e) {
        const ht = this.grid.hitTest(e);
        if (!ht || ht.cellType !== wijmo.grid.CellType.Cell) return;

        let item = (ht.row > -1 && this.grid.rows[ht.row]) ? this.grid.rows[ht.row].dataItem : null;
        if (!item && this.grid.selectedItems.length === 1) item = this.grid.selectedItems[0];
        if (!item) return Alert.alert('', '선택된 데이터가 없습니다.');

        AjaxUtil.getAsyncData(this.url + '/detail', { id: item.id }, (result) => {
          if (!result || !result.data) return Alert.alert('오류', '상세 데이터를 불러올 수 없습니다.');
          const d = result.data;

          const isSmall = window.matchMedia('(max-width: 1366px)').matches;

          if (isSmall) {
            // 작은 화면: 모달
            openFormModal('edit', d);

            // 모달 DOM이 붙은 뒤에 포맷/합계 적용
            setTimeout(() => {
              const $ctx = $('#basicForm_modal');

              // 우선 값 채우기(필요 시 fillForm로 대체)
              fillForm($ctx, d);  // 이미 쓰신다면 이 한 줄로 모두 바인딩
              // // 마일리지는 km 전용 포맷
              $ctx.find('#mileage').val(d.mileage ?? '');
              formatMileageInput($ctx.find('#mileage'));

              // 합계 보정
              //calculateTotal($ctx);

              // 포커스
              $ctx.find('#spcmngno').focus();
            }, 0);

          } else {
            // 큰 화면: 오른쪽 폼
            const $ctx = $('#basicForm');
            fillForm($ctx, d);
            $ctx.find('#itemcode').val(d.itemcode || '');
            // 숫자 필드 포맷
            formatNumberInput(d.partqty ?? '', '#partqty', $ctx);
            formatNumberInput(d.uamt    ?? '', '#uamt',    $ctx);
            formatNumberInput(d.h_totamt  ?? '', '#totamt',  $ctx);
            formatNumberInput(d.workpay ?? '', '#workpay', $ctx);

            // 마일리지는 km 전용 포맷
            formatMileageInput($ctx.find('#mileage'));

            // 합계 보정
            calculateTotal($ctx);
          }
        });
      }

      // 클릭/더블클릭 핸들러 동적 스위칭
      bindGridOpenHandler() {
        const host = this.grid.hostElement;
        const isSmall = window.matchMedia('(max-width: 1366px)').matches;

        // 중복 바인딩 방지: 기존 리스너 해제
        host.removeEventListener('click',    this._onOpenByClick);
        host.removeEventListener('dblclick', this._onOpenByDblClick);

        if (isSmall) {
          // 작은 화면: 클릭으로 오픈
          host.addEventListener('click', this._onOpenByClick, false);
        } else {
          // 큰 화면: 더블클릭으로 오픈
          host.addEventListener('dblclick', this._onOpenByDblClick, false);
        }
      }

      searchMainData() {
        let _this = this;

        let data = {
          'txtRegno': $('#txtRegno').val()
        }

        let fnsuccess = function (result) {
          if (result != null) {
            _this.viewData = new wijmo.collections.CollectionView(result.data);
            _this.grid.itemsSource = _this.viewData;
          }
        };

        AjaxUtil.getAsyncData(_this.url + '/read', data, fnsuccess);
      }

      //저장
      saveMainData($form) {
        const _this = this;
        const $ctx = $form && $form.length ? $form : getActiveForm();

        const itemRows = collectItemRows();
        if (itemRows.length === 0) {
          Alert.alert('', '작업/부품 행을 1개 이상 추가해 주세요.');
          return;
        }

        for (let i = 0; i < itemRows.length; i++) {
          const row = itemRows[i];
          if (!row.txtProductName || row.txtProductName.trim() === '') {
            Alert.alert('', `부품구분을 입력하세요.`);
            return;
          }
          if (!row.partqty || isNaN(row.partqty) || Number(row.partqty) <= 0) {
            Alert.alert('', `수량을 입력하세요.`);
            return;
          }
          if (!row.uamtPrice || isNaN(row.uamtPrice) || Number(row.uamtPrice) <= 0) {
            Alert.alert('', `단가를 입력하세요.`);
            return;
          }
        }

        if (!$ctx.find('#regno').val()) {
          Alert.alert('', '등록번호를 입력하세요.');
          return;
        }
        if (!$ctx.find('#itemcode').val()) {
          Alert.alert('', '차량명칭(차종)을 입력하세요.');
          return;
        }

        const data = {
          id: $ctx.find('#id').val(),
          as_id: $ctx.find('#as_id').val(),
          regno: $ctx.find('#regno').val(), //등록번호
          regdate: $ctx.find('#regdate').val(),
          vechidno: $ctx.find('#vechidno').val(),  //차대번호
          fixdate: $ctx.find('#fixdate').val(),
          pernm: $ctx.find('#pernm').val(),
          mileage: $ctx.find('#mileage').val().replace(/,/g, '').replace(/km/gi, '').trim() ,

          // 상단 요약
          partamt: $ctx.find('#partamt').val().replace(/,/g, ''),
          total_workpay: $ctx.find('#total_workpay').val().replace(/,/g, ''),
          total_amt: $ctx.find('#total_amt').val().replace(/,/g, ''),
          vat: $ctx.find('#vat').val().replace(/,/g, ''),
          totamt:$ctx.find('#totamt').val().replace(/,/g, ''),

          // 동적 행
          items: itemRows,
        };

        Alert.confirm('', '저장하시겠습니까?', function () {
          AjaxUtil.postJsonData(_this.url + '/save', data, function (result) {
            if (result && result.success) {
              Alert.alert('', '저장되었습니다.');
              _this.searchMainData();
              // 모달이면 닫기
              const isModal = $ctx.attr('id') === 'basicForm_modal';
              if (isModal) {
                const modal = $ctx.data('modal');
                if (modal && typeof modal.close === 'function') modal.close();
              } else {
                $('#btnNew').click(); // 기본 폼 초기화
              }
            } else {
              Alert.alert('', '저장에 실패했습니다.');
            }
          });
        });
      };

      deleteASData(id, opts = {}) {
        if (!id) {
          Alert.alert('', '삭제할 데이터가 없습니다. 먼저 목록에서 항목을 선택하세요.');
          return;
        }

        Alert.confirm('', '삭제하시겠습니까?', () => {
          const url = this.url + '/delete';
          const data = { id };

          AjaxUtil.postAsyncData(url, data, (res) => {
            if (res && res.success) {
              Notify.success('삭제되었습니다.');
              this.searchMainData();

              // ✅ 모달 모드 처리
              const $ctx  = opts.$ctx || $('#basicForm_modal');
              const modal = $ctx.data && $ctx.data('modal');
              const isModal = !!(opts.closeModal || ($ctx.length && modal));

              if (isModal) {
                if (modal && typeof modal.close === 'function') modal.close();
              } else {
                // 큰 화면만 초기화
                $('#btnNew').click();
              }
            } else {
              Alert.alert('', (res && res.message) ? res.message : '삭제에 실패했습니다.');
            }
          });
        });
      }
    }

    function getActiveForm() {
      return $('#basicForm_modal').length ? $('#basicForm_modal') : $('#basicForm');
    }

    // ✅ 옵션: bindItems(기본 true), format(기본 true)
    function fillForm($root, d, opts = {}) {
      const { bindItems = true, format = true } = opts;

      // --- 기본 필드 ---
      $root.find('#id').val(d.id || '');
      $root.find('#as_id').val(d.as_id || '');
      $root.find('#regno').val(d.vechregno || '');
      $root.find('#itemcode').val(d.itemcode || '');
      $root.find('#regdate').val(d.regdate || '');
      $root.find('#fixdate').val(d.fixdate || '');
      $root.find('#pernm').val(d.pernm || '');
      $root.find('#mileage').val(d.mileage || '');
      $root.find('#partamt').val(d.partamt || '');
      $root.find('#total_workpay').val(d.workamt || '');
      $root.find('#total_amt').val(d.amount || '');
      $root.find('#vat').val(d.vamt || '');
      $root.find('#totamt').val(d.h_totamt || '');

      // --- 아이템 배열 바인딩 ---
      if (bindItems) {
        // ※ 프로젝트에 이미 있는 함수 재사용
        populateItemRows($root, d.items || []);

        // ※ 비어있으면 1행 추가(UX 유지)
        const $rows = $root.find('.item-table tbody tr:not(.item-template-row)');
        if ($rows.length === 0) addItemRow($root);

        // 각 행 금액 재계산(필요시)
        $root.find('.item-table tbody tr:not(.item-template-row)').each(function () {
          recalcTotals($(this)); // 이미 가지고 계신 계산 함수 사용
        });
      }

      // --- 포맷/합계 보정 ---
      if (format) {
        formatMileageInput($root.find('#mileage')); // km 포맷
        // 총계 필드 포맷(있는 경우만)
        ['#partamt', '#total_workpay', '#total_amt', '#vat', '#totamt'].forEach(sel => {
          const $el = $root.find(sel);
          if ($el.length) formatNumberInput($el.val() ?? '', sel, $root);
        });
      }
    }

    // 기존 행에 우선 바인딩하고, 부족하면 그때만 행 추가
    function populateItemRows($root, items) {
      const $tbody = $root.find('.item-table tbody');
      let $rows = $tbody.find('tr:not(.item-template-row)');

      // 기본 1행도 없다면 1행 만들어 둠(UX 유지)
      if ($rows.length === 0) {
        addItemRow($root);
        $rows = $tbody.find('tr:not(.item-template-row)');
      }

      // 현재 DOM에 있는 행들부터 순서대로 채운다
      const list = items || [];

      // 필요한 만큼만 추가 (items가 더 많을 때만)
      while ($rows.length < list.length) {
        const idx = RowIdx.nextIndex();
        const $tmpl = $tbody.find('.item-template-row')
          .first()
          .clone(true, true)
          .removeClass('item-template-row')
          .show();

        applyIndexToRow($tmpl, idx);
        $tbody.append($tmpl);
        $rows = $tbody.find('tr:not(.item-template-row)');
      }

      // 인덱싱을 DOM 기준으로 다시 정렬(필요 시)
      reindexAllRows($root);

      // 최신 행 목록/인덱스 재확인
      $rows = $tbody.find('tr:not(.item-template-row)');

      // i번째 아이템 → i번째 기존 행에 바인딩
      for (let i = 0; i < list.length; i++) {
        const it = list[i];
        const $row = $rows.eq(i);
        const idx = $row.attr('data-row-index');

        $row.find(`[name="as_detail_id_${idx}"]`).val(it.id ?? '');
        $row.find(`[name="fixtext_${idx}"]`).val(it.fixtext ?? '');
        $row.find(`[name="txtProductName_${idx}"]`).val(it.partgroup ?? '');
        $row.find(`[name="part_id_${idx}"]`).val(it.part_id ?? '');
        $row.find(`[name="partqty_${idx}"]`).val(it.partqty ?? '');
        $row.find(`[name="uamtPrice_${idx}"]`).val(it.uamt ?? '');
        $row.find(`[name="amt_${idx}"]`).val(it.totamt ?? '');
        $row.find(`[name="workpay_${idx}"]`).val(it.workpay ?? '');

        // 숫자 필드 포맷
        ['partqty', 'uamtPrice', 'amt', 'workpay'].forEach(key => {
          const sel = `[name="${key}_${idx}"]`;
          formatNumberInput($row.find(sel).val(), sel, $root);
        });

        // 행 단위 재계산(있다면)
        if (typeof recalcTotals === 'function') recalcTotals($row);
      }

      // 남는 기존 행은 비워두기(삭제하지 않음)
      for (let j = list.length; j < $rows.length; j++) {
        const $row = $rows.eq(j);
        const idx = $row.attr('data-row-index');
        clearItemRowValues($row, idx); // 아래 헬퍼
      }

      // 상단 합계 갱신
      if (typeof recalcTotals === 'function') recalcTotals();
      if (typeof calculateTotal === 'function') calculateTotal($root);
    }

    // 남는 행 클리어 헬퍼
    function clearItemRowValues($row, idx) {
      [
        `as_detail_id_${idx}`, `fixtext_${idx}`, `txtProductName_${idx}`,
        `part_id_${idx}`, `partqty_${idx}`, `uamtPrice_${idx}`,
        `amt_${idx}`, `workpay_${idx}`
      ].forEach(name => $row.find(`[name="${name}"]`).val(''));
    }

    // 1) 뷰포트 기반 모달 크기 계산(아이패드 대응 포함)
    function calcModalSize() {
      const vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
      const vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;

      const OUTER_GAP_W = 40;  // 좌우 여백
      const OUTER_GAP_H = 40;  // 상하 여백

      // 최대치 제한 + 화면 가용 크기 반영
      const w = Math.min(vw - OUTER_GAP_W, 900);
      const h = Math.min(vh - OUTER_GAP_H, 700);

      return {w, h, bodyH: h - 96};
    }

    // 2) 모달 오픈 (신규/수정 공통)
    function openFormModal(mode /* 'new' | 'edit' */, initialData) {
      const title = (mode === 'new') ? '신규등록' : '수정';
      const modal = new PopupDraggable(title);

      // 중복 모달 방지
      try {
        $('#basicForm_modal').closest('.modal-form-wrap').remove();
      } catch (e) {
      }

      // 폼 클론
      const $clone = $('#basicForm').clone(true, true);
      $clone.attr('id', 'basicForm_modal');
      $clone.data('isModal', true);
      $clone.data('modal', modal);

      // 신규 초기화 / 수정 바인딩
      if (mode === 'new') {
        $clone[0].reset();
        $clone.find('input[type="hidden"]').val('');
        const today = new Date();
        $clone.find('#regdate').val(CommonUtil.formatYYYYMMDD(today));
        $clone.find('#fixdate').val(CommonUtil.formatYYYYMMDD(today));

        // 🔹 행 테이블 초기화(템플릿만 남기고 필요하면 빈 행 1개 추가)
        populateItemRows($clone, []);        // 템플릿만 유지
        addItemRow($clone);
      } else if (initialData) {
        // 🔹 수정 모드: 폼 + 행 리스트 바인딩
        fillForm($clone, initialData);
        populateItemRows($clone, initialData.items || []);
        addItemRow($clone);
      }

      // 모달 컨텐츠 래퍼
      // const $wrap = $('<div class="modal-form-wrap" style="padding:8px;"></div>').append($clone);
      const $wrap = $('<div class="modal-form-wrap"></div>').append($clone);

      // ===== 모달 전용 버튼 영역 (AS 접수선택 + 저장/삭제/닫기) =====
      // const $actions = $('<div style="margin-top:12px; display:flex; justify-content:center; flex-wrap:wrap; gap:8px;"></div>');
      const $actions = $('<div class="modal-actions" style="margin-top:12px; display:flex; justify-content:center; flex-wrap:wrap; gap:8px;"></div>');

      // AS 접수선택 (모달 내부)
      let $btnASListInModal = null;
      if (mode === 'new') {   // ✅ 신규 등록일 때만 보이게
        $btnASListInModal = $('<button type="button" class="btn-default btn-aslist">AS 접수선택</button>');
        $btnASListInModal.on('click', function () {
          let poppage = new PopASListComponent();
          poppage.show(function (items) {
            if (!items) return;
            $clone.find('#as_id').val(items.asid || '');
            $clone.find('#itemcode').val(items.itemcode || '');
            $clone.find('#regno').val(items.regno || '');
          });
        });
        $actions.append($btnASListInModal);
      }


      // 저장
      const $btnSaveModal = $('<button type="button" class="btn-default btn-aslist">저장</button>');
      $btnSaveModal.on('click', function () {
        page.saveMainData($clone);
      });
      $actions.append($btnSaveModal);

      // 삭제(수정 모드일 때만)
      let $btnDeleteModal = null;
      if (mode === 'edit') {
        $btnDeleteModal = $('<button type="button" class="btn-danger">삭제</button>');
        $btnDeleteModal.on('click', function () {
          const id = $clone.find('#id').val();
          page.deleteASData(id, { closeModal: true, $ctx: $clone });
        });
        $actions.append($btnDeleteModal);
      }

      // 닫기
      const $btnCloseModal = $('<button type="button" class="btn-popup">닫기</button>');
      $actions.append($btnCloseModal);

      $wrap.append($actions);

      // ===== 최초 오픈: 동적 크기 적용 =====
      const size0 = calcModalSize();
      modal.open({width: size0.w, height: size0.h, $content: $wrap});

      // 포커스 진입
      setTimeout(() => {
        $clone.find('#regno').focus();
      }, 0);

      // ===== 리사이즈 대응 (rAF 디바운스 + visualViewport) =====
      let resizeRAF = null;
      const doResize = () => {
        const s = calcModalSize();
        if (typeof modal.resize === 'function') modal.resize(s.w, s.h);
      };
      const onResize = () => {
        if (resizeRAF) cancelAnimationFrame(resizeRAF);
        resizeRAF = requestAnimationFrame(doResize);
      };

      window.addEventListener('resize', onResize);
      if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);

      // 정리 함수
      const cleanupResize = () => {
        if (resizeRAF) cancelAnimationFrame(resizeRAF);
        window.removeEventListener('resize', onResize);
        if (window.visualViewport) window.visualViewport.removeEventListener('resize', onResize);
      };

      // 닫기 버튼 핸들러 (리스너 해제 포함)
      $btnCloseModal.on('click', function () {
        cleanupResize();
        if (typeof modal.close === 'function') modal.close();
      });

      // 모달 자체 onClose 훅에서도 안전하게 정리
      const prevOnClose = modal.onClose;
      modal.onClose = () => {
        cleanupResize();
        if (typeof prevOnClose === 'function') prevOnClose();
      };

      // (선택) 오픈 직후 한 번 더 보정 — 모바일 키보드/툴바 늦게 반영 시
      setTimeout(doResize, 50);
    }

    // ✅ 공통 숫자 포맷 (콤마) - 컨텍스트 기반
    function formatNumberInput(inputValue, targetSelector, $ctx) {
      const $scope = ($ctx && $ctx.length) ? $ctx : getActiveForm();
      let cleaned = (inputValue || '').toString().replace(/[^0-9]/g, '').replace(/,/g, '');
      let formatted = cleaned.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      $scope.find(targetSelector).val(formatted);
    }

    // ✅ 마일리지 전용: '123,456 km' + 커서 ' km' 앞 고정
    function formatMileageInput($input) {
      let val = $input.val() || '';
      let digits = val.replace(/[^0-9]/g, '');
      let formatted = digits ? digits.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + ' km' : '';
      $input.val(formatted);

      // 빈 값이면 커서 고정 불필요
      if (!formatted) return;

      // 항상 ' km' 앞에 커서 고정 (음수 방어)
      const pos = Math.max(0, formatted.length - 3);
      const el = $input[0];
      if (el.setSelectionRange) el.setSelectionRange(pos, pos);
    }

    // ✅ 합계 계산 (인자 없으면 활성 폼)
    function calculateTotal($ctx) {
      const $scope = ($ctx && $ctx.length) ? $ctx : getActiveForm();
      if (!$scope || !$scope.length) return;

      let qty  = ($scope.find('#partqty').val() || '').replace(/[^0-9]/g, '');
      let uamt = ($scope.find('#uamt').val()    || '').replace(/[^0-9]/g, '');
      let total = (qty && uamt) ? (parseInt(qty, 10) * parseInt(uamt, 10)) : 0;

      formatNumberInput(total.toString(), '#totamt', $scope);
    }

    /* ======================
       이벤트 바인딩 (위임)
    ====================== */

    // 🔹 마일리지: 전용 핸들러만 바인딩 (중복 금지)
    $(document).on('input focus', '#basicForm #mileage, #basicForm_modal #mileage', function () {
      formatMileageInput($(this));
    });

    // 🔹 콤마 포맷(단가/합계/공임)
    $(document).on('input', '#basicForm #uamt, #basicForm_modal #uamt, #basicForm #totamt, #basicForm_modal #totamt, #basicForm #workpay, #basicForm_modal #workpay', function () {
      formatNumberInput(this.value, '#' + this.id, getActiveForm());
    });

    // 🔹 수량/단가 변경 시 합계 재계산
    $(document).on('input', '#basicForm #partqty, #basicForm_modal #partqty, #basicForm #uamt, #basicForm_modal #uamt', function () {
      // 입력 포맷
      formatNumberInput(this.value, '#' + this.id, getActiveForm());
      // 합계
      calculateTotal();
    });

    // ===== 행 인덱스 관리 =====
    const RowIdx = {
      next: 0,
      initFromDOM($tbody) {
        // DOM에 이미 있는 행이 있다면 (이전 저장본 바인딩 등) 최대 인덱스+1로 시작
        let maxIdx = -1;
        $tbody.find('tr:not(.item-template-row)').each(function () {
          const idx = parseInt($(this).attr('data-row-index'), 10);
          if (!isNaN(idx)) maxIdx = Math.max(maxIdx, idx);
        });
        this.next = maxIdx + 1;
      },
      nextIndex() {
        return this.next++;
      }
    };

    // name을 base_index 형태로 변환: id도 있으면 id도 맞춰줌(가능한 경우)
    function applyIndexToRow($tr, index) {
      $tr.attr('data-row-index', index);

      $tr.find('input, select, textarea, a, button').each(function () {
        const $el = $(this);

        // name 처리
        const name = $el.attr('name');
        if (name) {
          const base = name.replace(/_\d+$/, ''); // 이미 _숫자 붙어 있으면 제거
          $el.attr('name', `${base}_${index}`);
        }

        // id 처리(가능한 것만)
        const id = $el.attr('id');
        if (id) {
          const baseId = id.replace(/_\d+$/, '');
          $el.attr('id', `${baseId}_${index}`);
        }
      });
    }

    // 새 행 생성 (스코프 지원)
    function addItemRow($scope) {
      const $tbody = ($scope && $scope.length)
        ? $scope.find('.item-table tbody')
        : $('.item-table tbody');

      const $tmpl  = $tbody.find('.item-template-row').first();
      const idx    = RowIdx.nextIndex();

      const $row = $tmpl.clone(true, true).removeClass('item-template-row').show();
      applyIndexToRow($row, idx);
      $row.find('input[name^="partqty_"]').val('');
      $row.find('input[name^="uamtPrice_"]').val('');
      $row.find('input[name^="amt_"]').val('');
      $row.find('input[name^="workpay_"]').val('');
      $tbody.append($row);
    }

    // 삭제 후 0..N 재인덱싱(이름과 아이디 모두 다시 부여)
    function reindexAllRows($scope) {
      const $tbody = ($scope && $scope.length)
        ? $scope.find('.item-table tbody')
        : $('.item-table tbody');

      const $rows = $tbody.find('tr:not(.item-template-row)');
      RowIdx.next = 0;
      $rows.each(function () {
        const $tr = $(this);
        applyIndexToRow($tr, RowIdx.nextIndex());
      });
    }

    // 초기화(페이지 로드 시, 기존 데이터가 있다면 DOM 기준으로 next 설정)
    $(function () {
      RowIdx.initFromDOM($('.item-table tbody'));
    });

    // [+] 버튼: 행 추가
    $(document).on('click', '#addRemark', function (e) {
      e.preventDefault();
      const $form = $(this).closest('form');
      addItemRow($form);
      recalcTotals();
    });

    // [행 삭제] 버튼
    $(document).on('click', '.item-table a[title="행 삭제"]', function (e) {
      e.preventDefault();
      const $form = $(this).closest('form');
      const $tbody = $form.find('.item-table tbody');
      const $rows  = $tbody.find('tr:not(.item-template-row)');
      const $tr    = $(this).closest('tr');

      if ($rows.length <= 1) {
        $tr.find('input, select, textarea').each(function () {
          const $el = $(this);
          if ($el.is(':checkbox,:radio')) $el.prop('checked', false);
          else $el.val('');
        });
        return;
      }

      $tr.remove();
      reindexAllRows($form);
      recalcTotals();
    });

    // 숫자 포맷 + 행 합계 계산
    $(document).on('input', '.item-table input[name^="partqty_"], .item-table input[name^="uamtPrice_"]', function () {
      const $row = $(this).closest('tr');
      // 자신의 값은 포맷
      const sel = $(this).attr('name');
      formatNumberInput(this.value, `[name="${sel}"]`, $row.closest('form'));
      // 행 합계 계산
      calcRowAmount($row);
      // 전체 합계(상단 totamt 등) 반영이 필요하다면:
      recalcTotals();
    });

    // 🔹 행 공임 입력 시: 포맷 + 전체 합계 즉시 갱신
    $(document).on('input', '.item-table input[name^="workpay_"]', function () {
      const $form = $(this).closest('form');
      const sel = $(this).attr('name');
      formatNumberInput(this.value, `[name="${sel}"]`, $form); // 콤마 포맷
      recalcTotals(); // 상단 합계(공임 포함) 반영
    });

    function calcRowAmount($row) {
      const $form = getActiveForm();
      const qty  = (($row.find('input[name^="partqty_"]').val() || '').replace(/[^0-9]/g, '')) || '0';
      const uamt = (($row.find('input[name^="uamtPrice_"]').val() || '').replace(/[^0-9]/g, '')) || '0';
      const amt  = (parseInt(qty, 10) || 0) * (parseInt(uamt, 10) || 0);

      const $amt = $row.find('input[name^="amt_"]');
      formatNumberInput(String(amt), `[name="${$amt.attr('name')}"]`, $form);

      // ✅ 행 금액이 바뀌면 전체 합계 재계산
      recalcTotals();
    }

    // 전체 합계/수량/공임 집계 → 상단 필드에 반영
    function recalcTotals() {
      const $form = getActiveForm();
      if (!$form || !$form.length) return;

      const $rows = $form.find('.item-table tbody tr:not(.item-template-row)');

      let totalQty = 0;
      let sumRowAmt = 0;
      let sumWork   = 0;

      $rows.each(function () {
        const $r   = $(this);
        const qty  = parseInt(($r.find('input[name^="partqty_"]').val()   || '').replace(/[^0-9]/g, ''), 10) || 0;
        const uamtPrice  = parseInt(($r.find('input[name^="uamtPrice_"]').val()       || '').replace(/[^0-9]/g, ''), 10) || 0;
        const work = parseInt(($r.find('input[name^="workpay_"]').val()   || '').replace(/[^0-9]/g, ''), 10) || 0;

        totalQty  += qty;
        sumRowAmt += uamtPrice;
        sumWork   += work;
      });

      // 부품합계 = (각 행의 단가 합) 합
      const partsTotal = sumRowAmt;

      // 공급가액 = 부품합계 + 공임합계
      const supply = partsTotal + sumWork;

      // 부과세 = 공급가액 * 0.1 (원단위 버림; 필요 시 반올림으로 바꾸세요)
      const vat = Math.floor(supply * 0.1);

      // 합계 = 공급가액 + 부과세
      const grand = supply + vat;

      // 표기
      formatNumberInput(String(totalQty),   '#total_partqty',   $form); // 사용 중이면 유지
      formatNumberInput(String(partsTotal), '#partamt',       $form); // 부품합계
      formatNumberInput(String(sumWork),    '#total_workpay',   $form); // 공임합계
      formatNumberInput(String(supply),     '#total_amt',        $form); // 공급가액
      formatNumberInput(String(vat),        '#vat',             $form); // 부과세
      formatNumberInput(String(grand),      '#totamt',          $form); // 합계
    }

    // 모든 행을 객체 배열로 추출
    function collectItemRows($scope = getActiveForm()) {
      const items = [];
      const $rows = $scope.find('.item-table tbody tr:not(.item-template-row)');

      $rows.each(function () {
        const $r  = $(this);
        const idx = $r.attr('data-row-index');

        // base만 넘기면 name="${base}_${idx}"로 찾음
        const getVal = (base) => $r.find(`[name="${base}_${idx}"]`).val() || '';
        const num    = (s) => (s || '').replace(/[^0-9]/g, ''); // 소수 허용시 [^0-9.] 로

        // 빈 행 스킵하고 싶으면 사용 (옵션)
        const allEmpty =
          !getVal('fixtext') && !getVal('txtProductName') &&
          !getVal('partqty') && !getVal('uamtPrice') &&
          !getVal('amt') && !getVal('workpay');
        if (allEmpty) return;

        items.push({
          index: parseInt(idx, 10) || 0,
          as_detail_id: getVal('as_detail_id'), // ← hidden 필드도 같이 담아두면 수정에 유용
          fixtext: getVal('fixtext'),
          txtProductName: getVal('txtProductName'),
          part_id: getVal('part_id'),
          partqty: num(getVal('partqty')),
          uamtPrice: num(getVal('uamtPrice')),
          amt: num(getVal('amt')),
          workpay: num(getVal('workpay')),
        });
      });

      return items;
    }

    $(document).ready(function (e) {

      // ===== 반응형: 오른쪽 버튼영역을 왼쪽 상단으로 이동 =====
      const ResponsiveToolbar = (function () {
        const BREAKPOINT = 1366;
        const $sections = $('.layout-contents > div[style*="display: flex"]').children('section');
        const $leftSectionTop = $sections.eq(0).find('.section-top');
        const $rightSectionTop = $sections.eq(1).find('.section-top');

        // 원위치를 기억할 placeholder
        const $placeholder = $('<div id="rightSectionTop_ph" style="display:none;"></div>');
        let moved = false;

        function apply() {
          if (window.innerWidth <= BREAKPOINT && !moved) {
            // 원위치 기억
            $rightSectionTop.after($placeholder);
            // 왼쪽 상단으로 버튼영역 이동 (검색바 아래에 붙임)
            $rightSectionTop.appendTo($leftSectionTop);
            moved = true;
          } else if (window.innerWidth > BREAKPOINT && moved) {
            // 원위치로 복귀
            $placeholder.after($rightSectionTop);
            $placeholder.remove();
            moved = false;
          }
        }

        $(window).on('resize', apply);
        apply();
        return {apply};
      })();

      page = new ASManagementPage();

      let today = new Date();
      let monthStart = new Date(today.getFullYear(), today.getMonth(), 1);

      $('#regdate').val(CommonUtil.formatYYYYMMDD(today));
      $('#fixdate').val(CommonUtil.formatYYYYMMDD(today));

      AjaxUtil.fillSelectOptions($('#cboSpcmngno'), 'material_group', 'all', false);
      AjaxUtil.fillSelectOptions($('#spcmngno'), 'material_group', 'choose', false);

      page.searchMainData();

      // 검색
      $('#btnSearch').click(function (e) {
        e.preventDefault();
        page.searchMainData();
      });

      $('#btnSave').off('click').on('click', function (e) {
        e.preventDefault();
        page.saveMainData(getActiveForm());
      });

      $('#btnDel').off('click').on('click', function (e) {
        e.preventDefault();
        const id = getActiveForm().find('#id').val() || $('#id').val();
        page.deleteASData(id);
      });
      // 단가나 수량이 바뀔 때마다 합계 재계산
      $('#partqty, #uamt').on('input', function () {
        // 입력 필드 포맷 적용
        formatNumberInput(this.value, '#' + this.id);
        // 합계 재계산
        calculateTotal();
      });
      //초기화
      $('#btnNew').off('click').on('click', function (e) {
        e.preventDefault();
        if (window.innerWidth <= 1366) {
          openFormModal('new');
        } else {
          // 큰 화면: 기존 인라인 초기화 유지
          $('#basicForm')[0].reset();
          $('input[name="endflag"]').prop('checked', false);
          $('#basicForm').find('input[type="hidden"]').val('');
          const today = new Date();
          $('#regdate').val(CommonUtil.formatYYYYMMDD(today));
          $('#fixdate').val(CommonUtil.formatYYYYMMDD(today));
        }
      });

    });
  </script>
