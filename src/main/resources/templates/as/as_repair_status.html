<html layout:decorate="~{layout_page}">

<head>
  <style>
      .grid-cell-red {
          background: rgb(248, 210, 203) !important;
      }

  </style>
</head>

<th:block layout:fragment="content">
  <div class="layout-contents">
    <div class="page-title-wrap">
      <div class="left">
        <h2>AS 접수현황</h2>
        <a title="북마크" class="bookmark toggle">
          내 메뉴
        </a>
      </div>
      <ul class="page-navi">
        <li><img src="/images/icon/ico-nav-home.svg" alt="홈아이콘"></li>
        <li>AS 관리</li>
        <li>AS 접수현황</li>
      </ul>
    </div>
    <section class="section">
      <div class="section-top">
        <div class="search-wrap">
          <dl>
            <dt>
              등록기간<span class="eq">*</span>
            </dt>
            <dd>
              <ul class="date-box">
                <li>
                  <input type="date" id="srchStartDt" name="srchStartDt">
                  <label for="srchStartDt" class="hide">시작일</label>
                </li>
                <li>
                  <input type="date" id="srchEndDt" name="srchEndDt">
                  <label for="srchEndDt" class="hide">종료일</label>
                </li>
              </ul>
            </dd>
          </dl>
          <dl>
            <dt>
              <label for="txtvechidno">
                차대번호<span class="eq"></span>
              </label>
            </dt>
            <dd>
              <div class="srch-box">
                <input id="txtvechidno" name="txtvechidno" placeholder="차대번호" />
              </div>
            </dd>
          </dl>
          <dl>
            <dt>
              <label for="cboEndflag">
                출고여부<span class="eq"></span>
              </label>
            </dt>
            <dd>
              <div class="srch-box">
                <select id="cboEndflag" name="cboEndflag">
                  <option value="">전체</option>
                  <option value="1">미출고</option>
                  <option value="0">출고</option>
                </select>
              </div>
            </dd>
          </dl>

          <dl>
            <dt>&nbsp;</dt>
            <dd>
              <li>
                <a class="btn btn-delete" title="검색" id="btnSearch">
                  <!--                                        class 쓰이는 곳 찾고 없으면 클래스명 수정하기-->
                  <img src="/images/icon/btn-srch.svg" alt="검색 아이콘">
                  검색
                </a>
              </li>
            </dd>
          </dl>
        </div>
      </div>
      <div class="container-fluid">
        <div id="as-list-grid" style="height: 730px;"></div>
      </div>
    </section>
  </div>
</th:block>

<th:block layout:fragment="scripts">

  <script type="text/javascript">
    class ASRepairStatusPage {
      constructor() {
        this.gird = null;
        this.init();
        this.url = '/api/aftersales/ASRepairStatus';
      }

      init() {
        let _this = this;
        this.grid = new wijmo.grid.FlexGrid('#as-list-grid', {
          autoGenerateColumns: false,
          frozenColumns: 0, // 열 고정
          headersVisibility: wijmo.grid.HeadersVisibility.Column,
          selectionMode: wijmo.grid.SelectionMode.None, // 다중 선택 불가
          allowSorting: true, // 정렬 가능
          formatItem: (sender, e) => {
            if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
              e.cell.style.textAlign = 'center';
            }
          },
          columns: [
            {binding: 'id', header: 'id', visible: false},
            {binding: 'regdate', header: '등록일자', width: 120, align: 'center'},
            {binding: 'vechregno', header: '등록번호', width: 110, align: 'center'},
            {binding: 'itemcode', header: '차량명칭', width: 180, align: 'left'},
            {binding: 'fixdate', header: '점검일자', width: 120, align: 'center'},
            {binding: 'pernm', header: '정비기사', width: 100, align: 'center'},
            {binding: 'partamt', header: '부품합계', width: 100, align: 'right'},
            {binding: 'workamt', header: '공임합계', width: 100, align: 'right'},
            {binding: 'amount', header: '공급가액', width: 100, align: 'right'},
            {binding: 'vamt', header: '부과세', width: 100, align: 'right'},
            {binding: 'totamt', header: '합계', width: 100, align: 'right'},
            {binding: 'endflag', header: '출고여부', width: 80, align: 'center'},

            { binding: 'detail_id',      header: '상세ID',  visible: false },
            { binding: 'fixtext',        header: '작업내용', width: 220, align: 'left'   },
            { binding: 'partgroup',      header: '부품구분', width: 120, align: 'left'   },
            { binding: 'partqty',        header: '수량',     width: 70,  align: 'right', format: 'n0' },
            { binding: 'uamt',           header: '단가',     width: 100, align: 'right', format: 'n0' },
            { binding: 'detail_totamt',  header: '합계',     width: 100, align: 'right', format: 'n0' },
            { binding: 'detail_workpay', header: '공임',     width: 100, align: 'right', format: 'n0' },
          ],
          itemsSource: new wijmo.collections.CollectionView([]), // 빈 데이터로 초기화
        });
        new FlexGridContextMenu(this.grid);
        this.grid.downloadFileName = 'as 수리현황';

        this.grid.formatItem.addHandler((s, e) => {
          if (e.panel !== s.cells) return;

          const row = s.rows[e.row];

          // 1) 그룹행(GroupRow) 타이틀 커스터마이즈
          if (row instanceof wijmo.grid.GroupRow) {
            const group = row.dataItem;      // CollectionViewGroup
            const first = group.items[0];    // 그룹 안 첫번째 데이터

            if (first) {
              e.cell.colSpan = s.columns.length;   // 전체 셀 합치기 (가능한 경우)
              e.cell.innerHTML = `
        <strong>등록번호 : ${first.vechregno} /</strong>
        <strong>차대번호 : ${first.vechidno}</strong>
`;
            }
            return; // 그룹행이면 여기서 끝
          }

          // 2) 일반 행(디테일) 중복 헤더 컬럼 비우기
          const item = row.dataItem;
          const prev = e.row > 0 ? s.rows[e.row - 1].dataItem : null;

          if (prev && item.id === prev.id) {
            if (['regdate','vechregno','itemcode','fixdate','pernm','partamt','workamt','amount','vamt','totamt','endflag'].includes(s.columns[e.col].binding)) {
              e.cell.textContent = '';
            }
          }
        });

        $('#txtvechidno').on('keypress', function (e) {
          if (e.keyCode === 13) {
            _this.searchMainData();
          }
        })

      }

      searchMainData() {
        let _this = this;
        let start = $('#srchStartDt').val();  //시작일
        let end = $('#srchEndDt').val();

        let param = {
          'start': start,
          'end': end,
          'txtvechidno': $('#txtvechidno').val(),
          'cboEndflag' : $('#cboEndflag').val(),
        };

        let result = AjaxUtil.getSyncData(this.url + '/read', param);
        if (result != null) {
          const rows = result.data || [];

          // id 기준 그룹핑
          const cv = new wijmo.collections.CollectionView(rows, {
            groupDescriptions: [
              new wijmo.collections.PropertyGroupDescription('id')
            ]
          });

          // 그리드에 바인딩
          _this.grid.itemsSource = cv;
        }
      }
    }

    let page = null;

    $(document).ready(function (e) {

      page = new ASRepairStatusPage();

      $('#srchStartDt').val(CommonUtil.getYYYYMMDD(-7));
      $('#srchEndDt').val(CommonUtil.getYYYYMMDD());

      // 검색버튼
      $('#btnSearch').click(function (e) {
        page.searchMainData();

      });

      page.searchMainData();

    });


  </script>
</th:block>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
</html>
