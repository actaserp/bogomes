<!DOCTYPE html>
<html lang="ko">
<style>
  .contents-wrap {
    padding-bottom: 140px;  /* ✅ 버튼 높이(120px) + 여유 20px */
  }
  .btnArea{
    position: fixed;
    bottom: 0px;
    width: 93%;
    height: 120px;
  }

  .office_btn {
    background-color: #007aff;
    color: white;
    border: none;
    border-radius: 8px;
    width: 100px;
    height: 100px;
    font-size: 1.2em;
    cursor: pointer;
    transition: background-color 0.3s;
    display: block;
    margin-top: 10px;
    margin-bottom: 50px;
    border: none;
    box-shadow: 0 4px 5px rgba(0, 0, 0, 0.2);
  }

  #officeIcon {
    color: #ffffff;
    background-color: #9acaf4;
    border-radius: 10px;
    font-size: 2.5em;
    width: 15%;
    aspect-ratio: 1 / 1;
    padding-top: 2%;
    margin-right: 10%;
  }

  #selectWorkcd {
    max-height: 150px; /* 최대 150px까지만 보여줌 */
    overflow-y: auto;  /* 스크롤 가능하게 설정 */
  }

  .typeInput{
    margin-bottom: 5px;
  }

  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0; top: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.4);
  }

  /* === 모달창 크기 및 스크롤 추가 === */
  .modal-content {
    position: relative;
    background: #fff;
    margin: 7% auto;               /* 화면 중앙 정렬 */
    padding: 20px;
    border-radius: 10px;
    width: 70%;                    /* 전체 화면의 70% */
    max-width: 900px;
    height: 80vh;                  /* 전체 높이의 60% */
    display: flex;
    flex-direction: column;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);

    /* ✅ 스크롤 추가 */
    overflow-y: auto;              /* 세로 스크롤 */
    overflow-x: auto;              /* 가로 스크롤 */
    scrollbar-width: thin;         /* 파이어폭스용 얇은 스크롤 */
  }

  /* ✅ 크롬/엣지용 스크롤 디자인 */
  .modal-content::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  .modal-content::-webkit-scrollbar-thumb {
    background-color: rgba(100, 100, 100, 0.3);
    border-radius: 4px;
  }
  .modal-content::-webkit-scrollbar-thumb:hover {
    background-color: rgba(80, 80, 80, 0.6);
  }
  .modal-content::-webkit-scrollbar-track {
    background: transparent;
  }

  .close {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 24px;
    cursor: pointer;
  }

  #theGrid {
    width: 100%;
    overflow-x: auto;       /* ✅ 가로 스크롤 */
    overflow-y: auto;       /* 세로도 가능하게 */
    -webkit-overflow-scrolling: touch; /* 모바일 부드러운 스크롤 */
  }

  #theGrid table {
    width: 100%;
    border-collapse: collapse;
    min-width: 800px;       /* ✅ 최소 너비 지정 (컬럼 수 많을 때 자동 스크롤) */
  }

  #theGrid th, #theGrid td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: center;
    white-space: nowrap;    /* ✅ 한 줄 유지 (줄바꿈 방지) */
  }

  #theGrid th {
    background-color: #EDEFF5;
    font-weight: bold;
  }

  #theGrid2 {
    flex-grow: 1;
    min-height: 28vh;              /* 그리드 기본 높이 유지 */
    border: 1px solid #ccc;
  }

  /* === 모바일 최적화 === */
  @media (max-width: 768px) {
    .modal-content {
      width: 90%;
      height: 80vh;
      margin: 10% auto;
    }
  }

  /* 전체 행을 가로 정렬 */
  .time-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;          /* 좁은 화면에서는 자동 줄바꿈 */
    margin: 10px 0;
  }

  /* 각각의 시간 입력 영역 */
  .time-group {
    display: flex;
    flex-direction: column;   /* 제목과 input은 세로 정렬 */
    flex: 1 1 45%;            /* 반응형으로 2개가 한 줄에 나란히 */
    min-width: 180px;
  }

  /* 제목 스타일 */
  .time-group h3 {
    margin: 0 0 5px 0;
    font-size: 16px;
    font-weight: bold;
  }

  /* input 스타일 */
  .time-group input[type="time"] {
    width: 100%;
    font-size: 1.2rem;
    padding: 5px;
    box-sizing: border-box;
  }

  /* 모바일 반응형 */
  @media (max-width: 600px) {
    .time-group {
      flex: 1 1 100%; /* 모바일에서는 한 줄씩 */
    }
  }


  .wj-flexgrid {
    flex: 1 1 auto;
    min-height: 0; /* 중요! */
    background: #f8f8f8!important;
  }

  .wj-flexgrid .wj-header {
    background-color: #EDEFF5!important;
    color: black !important;
    font-weight: 700;

    font-size: 15px;
    line-height: 150%;
  }

  .wj-flexgrid .wj-cell {
    padding: 9px;
    font-size: 14px;
  }

  .wj-cells .wj-cell.wj-state-multi-selected {
    background-color: #E5F9F9!important;
    color: black !important;
  }

  .selected-row .wj-cell {
    background-color: #E5F9F9 !important;
    color: black !important;
  }

  .wj-flexgrid .wj-cell input.wj-column-selector {
    width: 16px;
    height: 16px;
  }

  .wj-flexgrid .wj-cell input.wj-column-selector:before {
    width: 16px;
    height: 16px;
  }

</style>

    const dd = String(today.getDate()).padStart(2, '0');      // 일

    const formattedDate = `${yyyy}-${mm}-${dd}`;

    // <input type="date">에 오늘 날짜 바인딩

    AjaxUtil.fillSelectOptions($('#selectWorkcd'), 'system_code', 'choose', false, 'class_work', '');

    $('#date_from').val(date_from);
    $('#date_to').val(date_to);

    searchMainData();

        })

              Alert.alert('', "근무구분 등록에 실패하였습니다.");
            }
          } else {
            Alert.alert('', "오류가 발생하였습니다.");
          }
        };
        AjaxUtil.postAsyncData(url, data, fnsuccess);
      })
    });

    $('#btnDeleteWorkType').on('click', function(){
      let code = $('#newWorkCode').val();

      if(!code || code.trim() === ''){
        Alert.alert('', '코드값이 없습니다.', function(){

        })
        return;
      }

      Alert.confirm('', '삭제하시겠습니까?', function(){
        let url = '/api/mobile_main/work_delete'
        let data = {
          'code' : code
        }

        let fnsuccess = function (result) {
          if (result != null) {
            if (result.success) {
              Alert.alert('', result.message, reloadWindow);
            } else {
              Alert.alert('', "근무구분 삭제에 실패하였습니다.");

        };
        AjaxUtil.postAsyncData(url, data, fnsuccess);

      })
    })

    // ======= 입력창 클릭 시 모달 열기 =======
    $('#work_order').on('click', function() {
      $('#modalWorkOrder').fadeIn(200);
      resizeGridHeight(); // 열릴 때 다시 높이 계산

    $('.close').on('click', function() {
      $('#modalWorkOrder').fadeOut(200);

    $(window).on('click', function(e) {
      if ($(e.target).is('#modalWorkOrder')) {
        $('#modalWorkOrder').fadeOut(200);

  // ======= 근무구분 추가 모달 열기 =======
  $('button:contains("+")').on('click', function() {

    let value = $('#selectWorkcd').val();                // ✅ 선택된 값 (value)
    let text = $('#selectWorkcd option:selected').text(); // ✅ 선택된 텍스트

    searhAndBinding(value);
    $('#modalWorkType').fadeIn(200);
  });

  // 닫기 버튼
  $('#modalWorkType .close').on('click', function() {
    $('#modalWorkType').fadeOut(200);
  });

  function searhAndBinding(code){
    let param = {
      'code' : code
    }

    let result = AjaxUtil.getSyncData('/api/mobile_main/search_work', param);
    if (result.data != null) {
       console.log('data', result.data);
       $('#newWorkCode').val(result.data.code);
       $('#newWorkName').val(result.data.value);
       $('#description').val(result.data.description);
    } else {
      $('#newWorkCode').val('');
      $('#newWorkName').val('');
      $('#description').val('');

    }
  }

  // ======= 그리드 높이 조정 (화면 1/3 비율) =======
  function resizeGridHeight() {
    if (!grid2) return; // 아직 초기화 안됐을 때 방지
    const gridHeight = window.innerHeight / 2;
    grid2.hostElement.style.height = gridHeight + 'px';
    grid2.refresh();
  }


  // ======= 작업지시 조회 =======
  function search_work_order() {

    let param = {
      'dateFrom' : $('#date_from').val(),
      'dateTo' : $('#date_to').val(),
      'isIncludeComp': $('#chxCompYn').is(':checked')
    }

    let result = AjaxUtil.getSyncData('/api/mobile_main/work_order', param);
    if (result && result.data) {
      viewData.sourceCollection = result.data;
    } else {
      viewData.sourceCollection = [];
    }
  }

  // 근무 등록(상태값에 따라 로직 변경)
  function submitCommute(office){
    console.log('office tag : ', office)
      //근무등록 버튼클릭
    if(office.trim() === 'inOfficeIn' || office.trim() === 'outOfficeIn') {
        let _this = this;
        let url = '/api/mobile_main/save'

        let work_order = document.getElementById('work_order').value;
        let jumun_num  = document.getElementById('jumun_num').value;

        if(!work_order || work_order.trim() === ''){
          Alert.alert('', '작업지시를 선택하세요.');
          return;
        }
        if(!work_order || work_order.trim() === ''){
          Alert.alert('', '작업지시를 선택하세요.');
          return;
        }

        let data = {
          'searchDate': document.getElementById('searchDate').value,
          'searchFromTime': document.getElementById('searchFromTime').value,
          'searchToTime': document.getElementById('searchToTime').value,
          'workcd': document.getElementById('selectWorkcd').value,
          'job_res_id' : work_order,
          'jumun_number' : jumun_num
        }

        let fnsuccess = function (result) {
          if (result != null) {
            if (result.success) {
              Alert.alert('', result.message, reloadWindow);
            } else {
              Alert.alert('', "근무 등록에 실패하였습니다.");
            }
          } else {
            Alert.alert('', "오류가 발생하였습니다.");
          }
        };
        AjaxUtil.postAsyncData(url, data, fnsuccess);
    }else{
      // ✅ 근무삭제 로직
      const checked = Array.from(document.querySelectorAll('.delete-checkbox:checked'))
              .map(cb => cb.value);

      if (checked.length === 0) {
        Alert.alert('', "삭제할 항목을 선택하세요.");
        return;
      }

      let url = '/api/mobile_main/deleteCommute';
      let csrfToken = $("[name=_csrf]").val();

      $.ajax({
        type: 'POST',
        url: url,
        data: { ids: checked },   // 🔥 배열 그대로 전달
        traditional: true,        // 🔥 ids=1&ids=2&ids=3 형식으로 변환됨
        headers: { 'X-CSRF-TOKEN': csrfToken },
        success: function(result) {
          if (result?.success) {
            Alert.alert('', result.message, reloadWindow);
          } else {
            Alert.alert('', "근무 삭제에 실패하였습니다.");
          }
        },
        error: function(xhr) {
          Alert.alert('', xhr.responseText || "서버 오류 발생");
        }
      });
    }

  }
  function reloadWindow(){
    console.log("확인 버튼 클릭됨");
    window.location.reload(); // ✅ 페이지 새로고침
  }
  function searchMainData() {
    let url = '/api/commute_current/read';
    let data = {
      'workDate' : document.getElementById('searchDate').value,
      'workcd': document.getElementById('selectWorkcd').value,
    };
    let fnsuccess = function (result) {
      console.log('result : ', result);

      // ✅ 데이터가 null이 아니면 실행
      if (result != null && result.data != null) {
        // 조회된 데이터
        const items = result.data;

        // ✅ 동적 테이블 생성
        let tableHtml = `
          <table>

                <th>작지번호</th>

                <th>근무구분</th>
                <th>시간</th>
                <th>삭제</th>
              </tr>
                `;

        items.forEach(item => {
          tableHtml += `
                    <tr>
                        <td>${item.job_res_num || '--:--'}</td>
                        <td>${item.jumun_number || '--:--'}</td>
                        <td>${item.starttime || '--:--'}</td>
                        <td>${item.endtime || '--:--'}</td>

                        <td>
                          <input type="checkbox" class="delete-checkbox" value="${item.id}">
                        </td>
                    </tr>
                `;
        });

        tableHtml += `
                </table>
            `;

        // ✅ 기존 내용 제거하고 새롭게 바인딩
        const tableBody = document.querySelector('#theGrid');
        tableBody.innerHTML = tableHtml;

        // ✅ 높이 보정
        tableBody.style.minHeight = '200px';
      } else {
        const tableBody = document.querySelector('#theGrid');
        tableBody.innerHTML = `
          <tr>
              <td colspan="5" style="text-align: center; padding: 8px;">조회된 데이터가 없습니다.</td>
          </tr>
      `;
      }
    };
    AjaxUtil.getAsyncData(url, data, fnsuccess);
  }
